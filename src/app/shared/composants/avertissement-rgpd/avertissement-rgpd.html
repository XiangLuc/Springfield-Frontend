<h2 mat-dialog-title>Données personnelles (RGPD)</h2>

<mat-dialog-content>
  <p>
    Ce texte est conservé et visible par les utilisateurs de l'application. Je m'engage à n'y
    indiquer aucune donnée personnelle : nom, numéro de téléphone, adresse e-mail…
  </p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button matButton="filled" type="button" [mat-dialog-close]="true" cdkFocusInitial>
    J'accepte
  </button>
</mat-dialog-actions>
